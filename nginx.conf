events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 40m;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Coarse per-instance backpressure. Precise identity limits live in the API.
    limit_req_zone $server_name zone=mofufans_api_global:1m rate=100r/s;
    server {
        listen 80;
        server_name _;
        root /work/frontend;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        limit_req_status 429;
        error_page 429 = @request_limited;
        location @request_limited {
            default_type application/json;
            add_header Retry-After 2 always;
            return 429 '{"code":429,"message":"请求较频繁，请稍后重试","retry_after":2}';
        }
        location /api/ {
            limit_req zone=mofufans_api_global burst=200 nodelay;
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
        # Includes OSS-backed images; never alias the private data directory.
        location /upload-img/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $http_host;
        }
        location = /admin { return 308 /admin/; }
        location /admin/ {
            root /work;
            try_files $uri $uri/index.html =404;
        }
        location / { try_files $uri $uri/index.html =404; }
    }
}
