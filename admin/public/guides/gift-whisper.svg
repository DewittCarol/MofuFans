<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img"><title>发领取私信：网站准备内容，B 站手动发送</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#99506e" stroke-width="1.5"/></marker></defs><rect width="840" height="430" rx="16" fill="#fff8fb"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif" fill="#513945"><text x="32" y="45" font-size="23" font-weight="700">发领取私信：网站准备内容，B 站手动发送</text><rect x="32" y="95" width="235" height="175" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="52" y="129" font-size="21" font-weight="600">1. 网站准备私信</text><text x="52" y="163" font-size="18">先保存并上架礼物</text><text x="52" y="192" font-size="18">选用户 / 填写 UID</text><text x="52" y="221" font-size="18">检查礼物名称和密码</text><rect x="303" y="95" width="235" height="175" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="323" y="129" font-size="21" font-weight="600">2. 打开并自动填入</text><text x="323" y="163" font-size="18">先安装私信助手</text><text x="323" y="192" font-size="18">跳转到 B 站私信页</text><text x="323" y="221" font-size="18">核对收件人和内容</text><rect x="574" y="95" width="234" height="175" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="594" y="129" font-size="21" font-weight="600">3. 手动发送</text><text x="594" y="163" font-size="18">在 B 站点击发送</text><text x="594" y="192" font-size="18">回到网站标记已发送</text><text x="594" y="221" font-size="18">助手不会自动群发</text><path d="M 268 178 H 292" fill="none" stroke="#99506e" stroke-width="2" marker-end="url(#arrow)"/><path d="M 539 178 H 563" fill="none" stroke="#99506e" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="328" font-size="18">没有安装助手，也可以使用「复制并打开私信」，到 B 站粘贴后发送。</text><text x="32" y="371" font-size="18">观众进入网站的「电子礼物」，找到同名礼物后领取。</text></g></svg>