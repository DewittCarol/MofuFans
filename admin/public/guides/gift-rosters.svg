<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img"><title>独立密码：共用名单资料，管理领取资格</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#99506e" stroke-width="1.5"/></marker></defs><rect width="840" height="430" rx="16" fill="#fff8fb"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif" fill="#513945"><text x="32" y="45" font-size="23" font-weight="700">独立密码：共用名单资料，管理领取资格</text><rect x="32" y="85" width="284" height="140" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="52" y="119" font-size="21" font-weight="600">名单管理</text><text x="52" y="153" font-size="18">导入、改资料、排除或删除</text><text x="52" y="182" font-size="18">这里修改的是原名单</text><rect x="380" y="85" width="428" height="140" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="400" y="119" font-size="21" font-weight="600">关联到电子礼物</text><text x="400" y="153" font-size="18">增删成员自动同步</text><text x="400" y="182" font-size="18">同一 UID 在多张名单中只占一行</text><rect x="380" y="265" width="428" height="120" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="400" y="299" font-size="21" font-weight="600">在电子礼物中「取消资格」</text><text x="400" y="333" font-size="18">只取消这一份礼物的领取资格</text><text x="400" y="362" font-size="18">原名单、实体舰礼和其他礼物不变</text><path d="M 317 155 H 369" fill="none" stroke="#99506e" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="300" font-size="18">仍在任一关联名单中，</text><text x="32" y="331" font-size="18">就保留来源名单资格。</text><text x="32" y="400" font-size="18">已经取消的本礼物资格，不会因为原名单更新而自动恢复。</text></g></svg>