<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img"><title>先选择这份电子礼物的领取方式</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#99506e" stroke-width="1.5"/></marker></defs><rect width="840" height="430" rx="16" fill="#fff8fb"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif" fill="#513945"><text x="32" y="45" font-size="23" font-weight="700">先选择这份电子礼物的领取方式</text><rect x="32" y="90" width="242" height="205" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="52" y="124" font-size="21" font-weight="600">无密码</text><text x="52" y="158" font-size="18">上架后直接查看和下载</text><text x="52" y="187" font-size="18">不用名单，不用发密码</text><rect x="299" y="90" width="242" height="205" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="319" y="124" font-size="21" font-weight="600">统一密码</text><text x="319" y="158" font-size="18">所有人使用同一个密码</text><text x="319" y="187" font-size="18">可关联名单批量通知</text><text x="319" y="216" font-size="18">私信里发送礼物密码</text><rect x="566" y="90" width="242" height="205" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="586" y="124" font-size="21" font-weight="600">每人独立密码</text><text x="586" y="158" font-size="18">先关联已有名单</text><text x="586" y="187" font-size="18">每个 UID 一份密码</text><text x="586" y="216" font-size="18">输入 UID 和密码领取</text><text x="32" y="346" font-size="18">创建后领取方式固定。公开简介谁都能看到，内容说明写在礼物内容中。</text><text x="32" y="384" font-size="18">文件放在内容下方：上传完成即保存，上架后按所选方式领取。</text></g></svg>