<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img"><title>示例：9 月先收齐地址，总督礼物稍后再寄</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#99506e" stroke-width="1.5"/></marker></defs><rect width="840" height="430" rx="16" fill="#fff8fb"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif" fill="#513945"><text x="32" y="45" font-size="23" font-weight="700">示例：9 月先收齐地址，总督礼物稍后再寄</text><rect x="32" y="85" width="280" height="140" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="52" y="119" font-size="21" font-weight="600">9 月地址收集</text><text x="52" y="153" font-size="18">舰长、提督、总督一起登记</text><text x="52" y="182" font-size="18">地址继续保留，不必重填</text><rect x="380" y="85" width="428" height="125" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="400" y="119" font-size="21" font-weight="600">第一次发货 · 舰长 + 提督</text><text x="400" y="153" font-size="18">选择准备好的礼物，导出地址</text><text x="400" y="182" font-size="18">寄出后登记运单</text><rect x="380" y="250" width="428" height="125" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="400" y="284" font-size="21" font-weight="600">第二次发货 · 总督</text><text x="400" y="318" font-size="18">制作完成后另建发货安排</text><text x="400" y="347" font-size="18">沿用已填地址，单独记录物流</text><path d="M 313 143 H 369" fill="none" stroke="#99506e" stroke-width="2" marker-end="url(#arrow)"/><path d="M 313 195 H 342 V 310 H 369" fill="none" stroke="#99506e" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="300" font-size="18">发货前地址有更新，</text><text x="32" y="331" font-size="18">先核对新地址再寄出。</text><text x="32" y="401" font-size="18">同一人可以有多个包裹，前台可以分别查看。</text></g></svg>