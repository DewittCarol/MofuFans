<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img"><title>实体礼物：展示、收地址、寄出，各有入口</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#99506e" stroke-width="1.5"/></marker></defs><rect width="840" height="430" rx="16" fill="#fff8fb"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif" fill="#513945"><text x="32" y="45" font-size="23" font-weight="700">实体礼物：展示、收地址、寄出，各有入口</text><rect x="32" y="80" width="236" height="120" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="52" y="114" font-size="21" font-weight="600">舰礼配置</text><text x="52" y="148" font-size="18">按月份展示礼物</text><text x="52" y="177" font-size="18">介绍、图片、发货说明</text><rect x="32" y="250" width="236" height="140" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="52" y="284" font-size="21" font-weight="600">名单管理</text><text x="52" y="318" font-size="18">按月或按活动建名单</text><text x="52" y="347" font-size="18">记录 UID 和档位</text><rect x="315" y="250" width="218" height="140" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="335" y="284" font-size="21" font-weight="600">地址收集</text><text x="335" y="318" font-size="18">选择名单与档位</text><text x="335" y="347" font-size="18">每人每批填一次</text><rect x="580" y="250" width="228" height="140" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="600" y="284" font-size="21" font-weight="600">发货管理</text><text x="600" y="318" font-size="18">选已经准备好的礼物</text><text x="600" y="347" font-size="18">生成包裹、登记运单</text><path d="M 269 320 H 304" fill="none" stroke="#99506e" stroke-width="2" marker-end="url(#arrow)"/><path d="M 534 320 H 569" fill="none" stroke="#99506e" stroke-width="2" marker-end="url(#arrow)"/><text x="315" y="124" font-size="18">礼物详情不决定谁能领取。</text><text x="315" y="157" font-size="18">领取范围由名单决定，地址可以先收集。</text><text x="315" y="190" font-size="18">礼物准备好后，再安排一次或多次寄送。</text></g></svg>