<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" role="img"><title>示例：9 月一起收地址，每个人领取的月份不同</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#99506e" stroke-width="1.5"/></marker></defs><rect width="840" height="430" rx="16" fill="#fff8fb"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif" fill="#513945"><text x="32" y="45" font-size="23" font-weight="700">示例：9 月一起收地址，每个人领取的月份不同</text><rect x="32" y="85" width="270" height="150" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="52" y="119" font-size="21" font-weight="600">本次选择的名单</text><text x="52" y="153" font-size="18">5 月、6 月、7 月、8 月</text><text x="52" y="182" font-size="18">另加 8 月转盘抽奖名单</text><rect x="355" y="85" width="450" height="128" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="375" y="119" font-size="21" font-weight="600">成员甲 · 出现在 5、6、8 月</text><text x="375" y="153" font-size="18">显示：5 月舰长、6 月舰长、8 月提督</text><text x="375" y="182" font-size="18">7 月不在名单中，就不会加上 7 月礼物</text><rect x="355" y="245" width="450" height="128" rx="10" fill="#f8e7ef" stroke="#ddb9ca"/><text x="375" y="279" font-size="21" font-weight="600">成员乙 · 出现在 5、6 月及抽奖</text><text x="375" y="313" font-size="18">显示：5 月舰长、6 月舰长、转盘奖品</text><text x="375" y="342" font-size="18">在这个收集批次只填写一次地址</text><path d="M 303 145 H 344" fill="none" stroke="#99506e" stroke-width="2" marker-end="url(#arrow)"/><path d="M 303 195 H 327 V 307 H 344" fill="none" stroke="#99506e" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="286" font-size="18">每个月可以单独选档位。</text><text x="32" y="320" font-size="18">活动名单按整张名单加入。</text><text x="32" y="397" font-size="18">以上人物和名单仅用于说明操作。</text></g></svg>